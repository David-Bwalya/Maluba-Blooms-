# Publishes the website to GitHub Pages and keeps the Instagram gallery in sync.
#
# GitHub Pages can't run PHP, so this job runs api/instagram.php on GitHub's
# servers and publishes its output as api/instagram-feed.json.
#
# Runs: on every push to main, every 6 hours, and on demand
# (Actions tab > "Publish site + Instagram sync" > Run workflow).
#
# Token: Settings > Secrets and variables > Actions > secret named
# INSTAGRAM_ACCESS_TOKEN. Without it the gallery shows api/instagram-posts.json.

name: Publish site + Instagram sync

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Instagram posts
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          if [ -n "$INSTAGRAM_ACCESS_TOKEN" ]; then
            # Extend the token's 60-day life (fails harmlessly if refreshed < 24h ago).
            curl -fsS -o /dev/null "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$INSTAGRAM_ACCESS_TOKEN" \
              || echo "::notice::Instagram token refresh skipped or failed."
          else
            echo "::notice::No INSTAGRAM_ACCESS_TOKEN secret yet; using the saved post list."
          fi
          php api/instagram.php > feed.json
          php -r '
            $d = json_decode(file_get_contents("feed.json"), true);
            if (!is_array($d) || !isset($d["posts"])) { echo "::error::Instagram script did not return valid JSON\n"; exit(1); }
            echo "Source: {$d["source"]}, posts: " . count($d["posts"]) . "\n";
            if (!empty($d["error"])) echo "::warning::Instagram sync failed, showing saved posts: {$d["error"]}\n";
          '

      - name: Build site folder
        # Only public files are published; PHP code and the instagram/ folder stay off the site.
        run: |
          mkdir -p _site/api
          cp -r index.html gallery.html product-gallery.html checkout.html css js images _site/
          cp api/instagram-posts.json _site/api/
          cp feed.json _site/api/instagram-feed.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
